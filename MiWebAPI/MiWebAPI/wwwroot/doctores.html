<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Doctores - vitaGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">vitaGo | Administración de Doctores</a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="index.html">Inicio</a>
                <button class="btn btn-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="mensaje" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <!-- FORMULARIO DE REGISTRO -->
            <section class="col-lg-4">
                <div class="card shadow-sm sticky-lg-top form-card">
                    <div class="card-body">
                        <h2 id="tituloFormulario" class="h4 mb-3">Nuevo doctor</h2>

                        <form id="formDoctor">
                            <input type="hidden" id="idDoctor" value="">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre(s)</label>
                                <input type="text" class="form-control" id="nombre" required maxlength="80">
                            </div>

                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" required maxlength="120">
                            </div>

                            <div class="mb-3">
                                <label for="especialidad" class="form-label">Especialidad principal</label>
                                <input type="text" class="form-control" id="especialidad" required maxlength="80" placeholder="Ej. Cardiología">
                            </div>

                            <div class="mb-3">
                                <label for="cedula" class="form-label">Cédula profesional</label>
                                <input type="text" class="form-control" id="cedula" required maxlength="20">
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" required maxlength="254">
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="telefono" maxlength="20" placeholder="Ej. 7711234567">
                            </div>

                            <div class="mb-3">
                                <label for="Bio" class="form-label">Biografía</label>
                                <textarea class="form-control" id="Bio" rows="2" maxlength="500" placeholder="Añade una descripción"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="aniosExperiencia" class="form-label">Años de experiencia</label>
                                <input type="number" class="form-control" id="aniosExperiencia" min="0" value="0">
                            </div>

                            <div class="mb-3">
                                <label for="numPacientes" class="form-label">Número de pacientes</label>
                                <input type="number" class="form-control" id="numPacientes" min="0" value="0">
                            </div>

                            <div class="mb-3">
                                <label for="idiomas" class="form-label">Idiomas</label>
                                <input type="text" class="form-control" id="idiomas" maxlength="200" placeholder="Ej. Español, Inglés">
                            </div>

                            <div class="mb-3">
                                <label for="precioConsulta" class="form-label">Precio de consulta ($)</label>
                                <input type="number" class="form-control" id="precioConsulta" required min="0" step="0.01" value="0.00">
                            </div>

                            <div class="mb-3">
                                <label for="consOnline" class="form-label">Consulta Online (0 o 1)</label>
                                <input type="number" class="form-control" id="consOnline" min="0" max="1" value="0">
                            </div>

                            <div class="mb-3">
                                <label for="verificado" class="form-label">Verificado (0 o 1)</label>
                                <input type="number" class="form-control" id="verificado" min="0" max="1" value="0">
                            </div>

                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="estado" maxlength="50" value="pendiente">
                            </div>

                            <div class="mb-3">
                                <label for="ratingPromedio" class="form-label">Rating Promedio</label>
                                <input type="number" class="form-control" id="ratingPromedio" min="0" max="5" step="0.1" value="0.0">
                            </div>

                            <div class="mb-3">
                                <label for="totalResenas" class="form-label">Total Reseñas</label>
                                <input type="number" class="form-control" id="totalResenas" min="0" value="0">
                            </div>

                            <div class="mb-3">
                                <label for="fotoUrl" class="form-label">Foto URL</label>
                                <input type="text" class="form-control" id="fotoUrl" maxlength="255" placeholder="Ruta o URL de la foto">
                            </div>

                            <div class="mb-3">
                                <label for="consultorio" class="form-label">Consultorio</label>
                                <input type="text" class="form-control" id="consultorio" maxlength="100" placeholder="Nombre de la clínica">
                            </div>

                            <div class="mb-3">
                                <label for="direccionConsultorio" class="form-label">Dirección del Consultorio</label>
                                <input type="text" class="form-control" id="direccionConsultorio" maxlength="200" placeholder="Calle y número">
                            </div>

                            <div class="mb-3">
                                <label for="ciudadConsultorio" class="form-label">Ciudad del Consultorio</label>
                                <input type="text" class="form-control" id="ciudadConsultorio" maxlength="100" placeholder="Ciudad o Municipio">
                            </div>

                            <div class="mb-4">
                                <label for="cpConsultorio" class="form-label">Código Postal Consultorio</label>
                                <input type="text" class="form-control" id="cpConsultorio" maxlength="10" placeholder="CP">
                            </div>

                            <div class="d-grid gap-2 d-sm-flex">
                                <button type="submit" id="btnGuardar" class="btn btn-primary flex-grow-1">
                                    Guardar
                                </button>
                                <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- TABLA Y LISTADO -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                            <div>
                                <h1 class="h3 mb-1">Lista de médicos</h1>
                                <p class="text-secondary mb-0">Datos sincronizados desde la API de .NET 8 (vitaGo).</p>
                            </div>
                            <button id="btnRecargar" class="btn btn-outline-primary align-self-md-start">
                                Recargar
                            </button>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Buscar</span>
                            <input id="txtFiltro" type="search" class="form-control"
                                   placeholder="Nombre, especialidad o correo">
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Nombre y Apellidos</th>
                                        <th>Especialidad</th>
                                        <th>Cédula</th>
                                        <th>Correo</th>
                                        <th>Teléfono</th>
                                        <th>Consultorio</th>
                                        <th>Experiencia</th>
                                        <th>Idiomas</th>
                                        <th class="text-end">Precio</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaDoctores"></tbody>
                            </table>
                        </div>

                        <div id="sinResultados" class="text-center text-secondary py-4 d-none">
                            No se encontraron doctores registrados.
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>protegerPagina();</script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
